---
- hosts: web
  become: yes

  tasks:

    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Start Docker
      service:
        name: docker
        state: started

    - name: Run Website Container
      docker_container:
        name: devops-container
        image: nginx
        state: started
        ports:
          - "80:80"